<!--
  A LITTLE SOMETHING
  ------------------------------------------------------------------
  To personalise this page, search this file for  EDIT HERE.
  Her name, your name, the date and the message are all in one small
  block of text near the bottom. You do not need to touch anything else.

  The little illustrations around the page ("stickers") live in the
  block marked  STICKERS  near the top of <body>. One line = one sticker.
-->

<style>
  :root {
    /* Palette */
    --ivory: #F6F3EC;
    --charcoal: #242B35;
    --grey: #858783;
    --bg: #2B1B14;          /* deep chocolate */
    --bg-deep: #1B100B;     /* edges of the page */
    --bg-glow: #432A1C;     /* soft candlelight behind the content */
    --choc: #6F4A3A;
    --espresso: #3B261C;
    --gold: #C9A96E;        /* champagne gold */
    --gold-deep: #B8964F;
    --paper: #FBF8F1;       /* the letter and the card */
    --ink-muted: #5C5A55;   /* small text on paper (6:1 contrast) */

    /* Envelope */
    --env-inside: #CDB99B;
    --env-front: #E8DCC6;
    --env-flap: #F2E9D8;
    --env-flap-inside: #D6C4A8;

    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; background: var(--bg-deep); }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ivory);
    background: radial-gradient(ellipse 85% 70% at 50% 40%, var(--bg-glow) 0%, var(--bg) 52%, var(--bg-deep) 100%) fixed;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding:
      max(2rem, env(safe-area-inset-top))
      max(1rem, env(safe-area-inset-right))
      max(2rem, env(safe-area-inset-bottom))
      max(1rem, env(safe-area-inset-left));
  }

  .screen {
    grid-area: 1 / 1;
    width: 100%;
    max-width: 34rem;
    text-align: center;
  }

  /* ---------- Shared motion ---------- */

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes draw { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }

  /* Intro entrance. "backwards" fill so the opening transitions below can take over afterwards. */
  .enter {
    animation: fade .9s var(--ease) backwards;
    animation-delay: calc(var(--i, 0) * 130ms + 100ms);
  }
  .enter--rise { animation-name: rise; }

  /* ---------- Stickers ---------- */

  .decor {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  /* --x/--y = centre on phones and tablets, --xl/--yl = centre on wide screens (percent of the window).
     --s / --sl = height in px on phones / wide screens. --r = tilt in degrees. */
  .st {
    --k: 1;
    position: absolute;
    left: var(--x);
    top: var(--y);
    height: calc(var(--s) * var(--k) * 1px);
    width: calc(var(--s) * var(--k) * var(--ar) * 1px);
    transform: translate(-50%, -50%) rotate(calc(var(--r) * 1deg));
    animation: settle 1.1s var(--ease) backwards;
    animation-delay: calc(var(--i) * 70ms + 300ms);
  }
  .st svg { display: block; width: 100%; height: 100%; overflow: visible; }

  @keyframes settle {
    from { opacity: 0; transform: translate(-50%, calc(-50% - 16px)) rotate(calc(var(--r) * 1deg - 10deg)) scale(.9); }
    to   { opacity: 1; transform: translate(-50%, -50%) rotate(calc(var(--r) * 1deg)) scale(1); }
  }

  /* Phones and tablets: stickers frame the content from above, below and the sides.
     Wide screens (1100px and up): they fill the space on both sides of it. */
  @media (max-width: 1099px) { .st--wide { display: none; } }
  @media (min-width: 720px) and (max-width: 1099px) { .st { --k: 1.35; } }
  @media (max-height: 600px) { .st { --k: .8; } }
  @media (max-height: 480px) { .st { display: none; } }
  @media (min-width: 1100px) {
    .st {
      left: var(--xl);
      top: var(--yl);
      height: calc(var(--sl) * var(--k) * 1px);
      width: calc(var(--sl) * var(--k) * var(--ar) * 1px);
    }
  }
  @media (min-width: 1100px) and (max-height: 600px) { .st { --k: .7; } }

  /* ---------- Screen 1: introduction ---------- */

  .intro {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .intro__title {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2rem, 8.5vw, 3.1rem);
    line-height: 1.15;
    letter-spacing: -.01em;
    text-wrap: balance;
  }

  .intro__date {
    margin: 1.25rem 0 0;
    font-size: .75rem;
    font-weight: 500;
    line-height: 1;
    letter-spacing: .2em;
    text-indent: .2em; /* balances the trailing letter-space so the line stays optically centred */
    text-transform: uppercase;
    color: var(--gold);
  }

  .btn {
    appearance: none;
    border: 0;
    border-radius: 2px;
    min-height: 3rem;
    padding: 1.1rem 2rem;
    background: var(--ivory);
    color: var(--espresso);
    font: 500 .8rem/1 var(--sans);
    letter-spacing: .18em;
    text-indent: .18em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background-color .3s var(--ease), transform .3s var(--ease);
  }
  .btn:hover { background: var(--gold); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

  /* ---------- The envelope ---------- */

  .envelope {
    --w: min(76vw, 320px);
    --h: calc(var(--w) * .66);
    position: relative;
    width: var(--w);
    height: var(--h);
    margin: clamp(2.25rem, 7vh, 3.5rem) 0 clamp(2rem, 6vh, 2.75rem);
    perspective: 900px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .5s var(--ease);
  }

  /* Soft ground shadow */
  .envelope::before {
    content: "";
    position: absolute;
    z-index: -1;
    left: 8%;
    right: 8%;
    bottom: -.9rem;
    height: 1rem;
    border-radius: 50%;
    background: rgba(0, 0, 0, .55);
    filter: blur(12px);
  }

  @media (hover: hover) {
    .intro:not(.is-opening) .envelope:hover { transform: translateY(-4px); }
  }

  .env__back {
    position: absolute;
    inset: 0;
    background: var(--env-inside);
  }

  .env__letter {
    position: absolute;
    z-index: 1;
    left: 7%;
    top: 3%;
    width: 86%;
    height: 97%;
    background: var(--paper);
  }

  .env__line {
    position: absolute;
    left: 12%;
    height: 2px;
    border-radius: 1px;
    background: rgba(133, 135, 131, .4);
  }
  .env__line--accent { top: 12%; width: 22%; background: rgba(184, 150, 79, .9); }
  .env__line:nth-child(2) { top: 24%; width: 70%; }
  .env__line:nth-child(3) { top: 32%; width: 62%; }
  .env__line:nth-child(4) { top: 40%; width: 46%; }

  /* Front of the envelope: everything except the top triangle, which the flap covers */
  .env__pocket {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: var(--env-front);
    clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
  }
  .env__pocket svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .env__pocket path {
    fill: none;
    stroke: rgba(59, 38, 28, .22);
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }

  .env__flap {
    position: absolute;
    z-index: 3;
    left: 0;
    top: 0;
    width: 100%;
    height: 55%;
    transform-origin: 50% 0;
    transform-style: preserve-3d;
  }
  .env__face {
    position: absolute;
    inset: 0;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .env__face--front { background: var(--env-flap); }
  .env__face--back { background: var(--env-flap-inside); transform: rotateY(180deg); }

  /* Black satin bow tied at the tip of the flap */
  .env__bow {
    position: absolute;
    z-index: 4;
    left: 50%;
    top: 55%;
    width: 26%;
    aspect-ratio: 1;
    transform: translate(-50%, -52%);
    color: #1B1210;
    filter: drop-shadow(0 2px 3px rgba(59, 38, 28, .35));
    transition: opacity .25s ease, transform .25s ease;
  }
  .env__bow svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* ---------- Opening sequence ----------
     0.00s  words and button fade out, bow fades
     0.25s  flap swings open (z-order swaps at its midpoint, 0.65s)
     0.85s  letter slides up out of the envelope
     2.00s  scene fades out (JS)  ->  2.55s message screen appears (JS) */

  .is-opening .enter:not(.envelope) {
    animation: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity .45s ease;
  }
  .is-opening .envelope { animation: none; cursor: default; pointer-events: none; }
  .is-opening .env__bow { opacity: 0; transform: translate(-50%, -52%) scale(.7); }
  .is-opening .env__flap {
    transform: rotateX(-180deg);
    z-index: 0;
    transition: transform .8s cubic-bezier(.45, 0, .25, 1) .25s, z-index 0s linear .65s;
  }
  .is-opening .env__letter {
    transform: translateY(calc(var(--h) * -.42));
    box-shadow: 0 0 0 1px rgba(59, 38, 28, .1), 0 6px 18px rgba(0, 0, 0, .3);
    transition: transform .9s cubic-bezier(.22, .75, .3, 1) .85s;
  }
  .intro.is-leaving { opacity: 0; transition: opacity .55s ease; }

  /* ---------- Screen 3: the message (an ivory card) ---------- */

  .message { max-width: 32rem; }

  .card {
    position: relative;
    padding: clamp(2.1rem, 7vw, 3.4rem) clamp(1.4rem, 6vw, 3.25rem);
    background: var(--paper);
    color: var(--charcoal);
    border-radius: 3px;
    box-shadow: 0 34px 60px -26px rgba(0, 0, 0, .7), 0 2px 8px rgba(0, 0, 0, .3);
    animation: rise 1s var(--ease) both;
  }
  /* A fine gold line, inset like the edge of a stationery card */
  .card::before {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px solid rgba(184, 150, 79, .55);
    border-radius: 2px;
    pointer-events: none;
  }

  .reveal {
    animation: rise 1s var(--ease) both;
    animation-delay: calc(var(--i, 0) * 260ms + 350ms);
  }

  .msg__greeting {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.2rem, 10vw, 3.3rem);
    line-height: 1.1;
    letter-spacing: -.015em;
    text-wrap: balance;
  }
  .msg__greeting:focus { outline: none; }

  .msg__rule {
    display: block;
    width: 2.75rem;
    height: 1px;
    margin: 1.4rem auto 1.7rem;
    background: var(--gold-deep);
    animation: draw 1.1s var(--ease) both;
    animation-delay: calc(var(--i, 0) * 260ms + 350ms);
  }

  .msg__body p {
    max-width: 24rem;
    margin: 0 auto 1.1rem;
    font-size: 1rem;
    line-height: 1.7;
    text-wrap: pretty;
  }
  .msg__body p:last-child { margin-bottom: 0; }

  .msg__closing {
    margin: 2rem 0 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1.3rem, 5.6vw, 1.85rem);
    line-height: 1.3;
    color: var(--choc);
    text-wrap: balance;
  }

  .msg__signature {
    margin: 2rem 0 0;
    font-size: .875rem;
    letter-spacing: .02em;
    color: var(--ink-muted);
  }

  /* ---------- Sound on / off ---------- */

  .sound-toggle {
    position: fixed;
    top: max(.5rem, env(safe-area-inset-top));
    right: max(.5rem, env(safe-area-inset-right));
    z-index: 5;
    display: grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    padding: 0;
    border: 1px solid rgba(201, 169, 110, .45);
    border-radius: 50%;
    background: rgba(27, 16, 11, .6);
    color: var(--gold);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background-color .3s var(--ease), border-color .3s var(--ease);
    animation: fade .9s var(--ease) 1s backwards;
  }
  .sound-toggle:hover { background: rgba(27, 16, 11, .85); border-color: var(--gold); }
  .sound-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .sound-toggle svg {
    width: 1.25rem;
    height: 1.25rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sound-toggle .slash { display: none; }
  .sound-toggle.is-off .wave { display: none; }
  .sound-toggle.is-off .slash { display: block; }

  /* ---------- Quiet celebration: a few champagne bubbles rising ---------- */

  .particles {
    position: fixed;
    inset: 0;
    z-index: 3;
    overflow: hidden;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    left: 50%;
    top: 56%;
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    opacity: 0;
    animation: drift var(--dur) var(--ease) var(--delay) both;
  }

  @keyframes drift {
    0%   { opacity: 0; transform: translate(0, 0) scale(.6); }
    18%  { opacity: .75; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); }
  }

  /* ---------- Reduced motion: no envelope animation, no bubbles, no staggered reveals ---------- */

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-delay: 0s !important;
      transition-duration: .001ms !important;
      transition-delay: 0s !important;
    }
    .particles { display: none; }
  }
</style>
</head>

  <main class="stage">

    <!-- Screen 1 + 2: introduction and envelope -->

      <h1 class="intro__title enter" id="intro-title" style="--i:0"></h1>
      <p class="intro__date enter" id="intro-date" style="--i:1"></p>

      <!-- Decorative; clicking it opens the letter too. The button below is the accessible control. -->
      <div class="envelope enter enter--rise" id="envelope" aria-hidden="true" style="--i:2">
        <div class="env__back"></div>
        <div class="env__letter">
          <span class="env__line env__line--accent"></span>
          <span class="env__line"></span>
          <span class="env__line"></span>
          <span class="env__line"></span>
        </div>
        <div class="env__pocket">
          <svg viewBox="0 0 100 66" preserveAspectRatio="none" focusable="false"><path d="M0 66 L50 35.6 L100 66"/></svg>
        </div>
        <div class="env__flap">
          <div class="env__face env__face--front"></div>
          <div class="env__face env__face--back"></div>
        </div>
        <div class="env__bow"><svg viewBox="0 0 100 100" focusable="false"><use href="#a-bow"/></svg></div>
      </div>

      <button class="btn enter" id="open-btn" type="button" style="--i:3">Open when ready</button>
    </section>

    <!-- Screen 3: the message (filled in from CONFIG) -->
    <section class="screen message" id="message" aria-labelledby="msg-title" hidden>
      <div class="card">
        <h2 class="msg__greeting reveal" id="msg-title" tabindex="-1" style="--i:0"></h2>
        <span class="msg__rule" aria-hidden="true" style="--i:1"></span>
        <div class="msg__body" id="msg-body"></div>
        <p class="msg__closing reveal" id="msg-closing"></p>
        <p class="msg__signature reveal" id="msg-signature"></p>
      </div>
    </section>

  </main>

      <path class="wave" d="M15.2 9.2c1.2 1.5 1.2 4.1 0 5.6M17.8 6.8c2.4 2.8 2.4 7.6 0 10.4"/>

  <!-- ============================================================
       EDIT HERE — the only part of this file you need to change.
       Keep the quotation marks and commas. If your text contains a
       double quote ("), write it as \" instead.
       ============================================================ -->
  <script>
    const CONFIG = {
      recipientName: "Laila",     // appears in the heading: "A little something for ___."
      senderName:    "Abdul",          // appears in the signature: "A little thought from ___"
      birthdayDate:  "November 25, 2026",  // shown in capitals under the heading

      sound: true,                         // soft paper and chime sounds when the letter opens (true / false)

      // Optional background music. Put the audio file in the same folder as this page and type its name
      // here, for example "music.mp3". It starts as soon as the page opens, or on her first tap if the
      // browser blocks that. Leave "" for no music.
      music: "Background.mp3",
      musicLoop: false,                    // true = start again when the track ends

      greeting: "Happy Birthday!",

      // One line of text per paragraph. Add or remove lines as you like.
      message: [
        "May Your Neighbors Respect You",
        "Trouble Neglect You",
        "Angels Protect You",
        "And Heaven Accept You",
        "Hope this new chapter brings you good people, unexpected opportunities, beautiful memories, and plenty of reasons to smile.",
        "Wishing you nothing but good things in the year ahead."
      ],

      closing: "Here’s to a good year ahead."
    };
  </script>

  <!-- Behaviour. Nothing to edit below this line. -->
  <script>
    (function () {
      'use strict';

      const C = CONFIG;
      const $ = (id) => document.getElementById(id);

      const intro = $('intro');
      const message = $('message');
      const envelope = $('envelope');
      const openBtn = $('open-btn');
      const greeting = $('msg-title');
      const body = $('msg-body');
      const closing = $('msg-closing');
      const signature = $('msg-signature');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      // Timing (ms). Keep in step with the opening sequence described in the CSS.
      const FADE_OUT_AT = 2000;
      const SHOW_MESSAGE_AT = 2550;

      let opened = false;

      // ----- Sound -----
      // Everything is synthesised in the browser, so there are no audio files to host.
      // It only starts after a tap (browsers require that), stays quiet, and lasts about three seconds.
      const VOLUME = 0.8;                       // overall level, 0 to 1
      const SOUND_KEY = 'a-little-something-sound';
      const soundBtn = $('sound-toggle');
      let soundOn = true;
      try { soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) { /* storage blocked: keep the default */ }

      let ac = null, master = null, send = null, noise = null;

      function showSoundState() {
        soundBtn.setAttribute('aria-pressed', String(soundOn));
        soundBtn.setAttribute('aria-label', soundOn ? 'Turn sound off' : 'Turn sound on');
        soundBtn.classList.toggle('is-off', !soundOn);
      }

      function getAudio() {
        if (ac) return ac;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try {
          ac = new AC();
          master = ac.createGain();
          master.gain.value = soundOn ? VOLUME : 0;
          master.connect(ac.destination);

          // A faint, soft echo gives the chime a little room.
          const delay = ac.createDelay(1);
          delay.delayTime.value = 0.21;
          const damp = ac.createBiquadFilter();
          damp.type = 'lowpass';
          damp.frequency.value = 3200;
          const feedback = ac.createGain();
          feedback.gain.value = 0.3;
          send = ac.createGain();
          send.gain.value = 0.35;
          send.connect(delay);
          delay.connect(damp);
          damp.connect(master);
          damp.connect(feedback);
          feedback.connect(delay);

          // Two seconds of noise, reused for both paper sounds.
          noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
          const data = noise.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        } catch (e) {
          ac = null;
        }
        return ac;
      }

      function noiseSource() {
        const src = ac.createBufferSource();
        src.buffer = noise;
        src.loop = true;
        return src;
      }

      // The flap lifting: a short, dry crinkle that swells and fades.
      function rustle(t, dur) {
        const src = noiseSource();
        const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 4200; bp.Q.value = 0.7;
        const g = ac.createGain(); g.gain.value = 0;
        src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(master);
        const step = 0.035, n = Math.round(dur / step);
        for (let k = 0; k < n; k++) {
          const swell = Math.sin(Math.PI * (k + 0.5) / n);
          g.gain.setTargetAtTime(0.1 * swell * (0.25 + Math.random() * 0.75), t + k * step, 0.006);
        }
        g.gain.setTargetAtTime(0, t + dur, 0.03);
        src.start(t, Math.random() * 1.5);
        src.stop(t + dur + 0.4);
      }

      // The letter sliding out: a soft "shh" that starts quickly and eases off, like the motion.
      function slide(t, dur) {
        const src = noiseSource();
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
        bp.frequency.setValueAtTime(2600, t);
        bp.frequency.exponentialRampToValueAtTime(1200, t + dur);
        const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5000;
        const g = ac.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.075, t + dur * 0.15);
        g.gain.linearRampToValueAtTime(0, t + dur);
        src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(master);
        src.start(t, Math.random() * 1.5);
        src.stop(t + dur + 0.1);
      }

      // The card appearing: two soft glass notes, an open fifth, ringing out.
      function chime(t) {
        [[880, 0], [1318.5, 0.17]].forEach(([freq, offset]) => {
          const s = t + offset;
          [[1, 0.2, 1.7], [2.76, 0.06, 0.6], [5.4, 0.025, 0.25]].forEach(([mult, amp, decay]) => {
            const o = ac.createOscillator();
            o.type = 'sine';
            o.frequency.value = freq * mult;
            const g = ac.createGain();
            g.gain.setValueAtTime(0, s);
            g.gain.linearRampToValueAtTime(amp, s + 0.006);
            g.gain.exponentialRampToValueAtTime(0.0001, s + decay);
            o.connect(g); g.connect(master); g.connect(send);
            o.start(s);
            o.stop(s + decay + 0.05);
          });
        });
      }

      function playOpeningSounds(reduced) {
        if (!C.sound || !soundOn) return;
        const ctx = getAudio();
        if (!ctx) return;
        const go = () => {
          const t = ctx.currentTime;
          if (reduced) { chime(t + 0.05); return; }      // no animation, so only the chime
          rustle(t + 0.28, 0.6);                          // flap opens
          slide(t + 0.88, 0.85);                          // letter slides out
          chime(t + SHOW_MESSAGE_AT / 1000);              // card appears
        };
        if (ctx.state === 'running') go(); else ctx.resume().then(go, () => {});
      }

      // ----- Background music (optional: set "music" in CONFIG) -----
      // It tries to start the moment the page opens. Browsers usually block sound until the visitor
      // touches the page, so if it is blocked, it starts on her very first tap or key press instead.
      // The speaker button controls it too.
      const MUSIC_VOLUME = 0.45;   // 0 to 1
      const MUSIC_FADE_MS = 3000;  // how long the fade-in takes
      const UNLOCK_EVENTS = ['pointerdown', 'pointerup', 'touchend', 'keydown', 'click'];
      let music = null, started = false, fadeTimer = 0;

      if (C.sound && C.music) {
        music = new Audio();
        music.preload = 'auto';
        music.loop = Boolean(C.musicLoop);
        music.volume = 0;
        music.addEventListener('error', () => {
          console.warn('A Little Something: could not load the music file "' + C.music + '". Check the name and that it sits next to index.html.');
          music = null;
        });
        music.src = C.music;
      }

      function removeUnlock() {
        UNLOCK_EVENTS.forEach((ev) => window.removeEventListener(ev, startMusic));
      }

      function fadeMusicIn() {
        clearInterval(fadeTimer);
        const t0 = performance.now();
        fadeTimer = setInterval(() => {
          if (!music) { clearInterval(fadeTimer); return; }
          const k = Math.min(1, (performance.now() - t0) / MUSIC_FADE_MS);
          music.volume = MUSIC_VOLUME * k;   // iPhones ignore this and play at the file's own level
          if (k === 1) clearInterval(fadeTimer);
        }, 100);
      }

      function startMusic() {
        if (!music) { removeUnlock(); return; }
        if (!soundOn || started) return;
        music.muted = false;
        music.volume = 0;
        const begun = () => { started = true; removeUnlock(); fadeMusicIn(); };
        const p = music.play();
        if (p && p.then) p.then(begun, () => { /* blocked until she touches the page */ });
        else begun();
      }

      function stopMusic() {
        clearInterval(fadeTimer);
        started = false;
        if (music) music.pause();
      }

      if (music) {
        UNLOCK_EVENTS.forEach((ev) => window.addEventListener(ev, startMusic, { passive: true }));
        startMusic();   // try straight away; this only works where the browser allows it
      }

      if (C.sound) {
        showSoundState();
        soundBtn.addEventListener('click', () => {
          soundOn = !soundOn;
          try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch (e) { /* ignore */ }
          showSoundState();
          if (soundOn) getAudio(); // unlock audio during this tap
          if (ac) master.gain.setTargetAtTime(soundOn ? VOLUME : 0, ac.currentTime, 0.03);
          if (!soundOn) stopMusic(); else startMusic();
        });
      } else {
        soundBtn.hidden = true;
      }

      // ----- Fill the page from CONFIG (textContent: nothing is parsed as HTML) -----
      document.title = 'A little something for ' + C.recipientName;
      $('intro-title').textContent = 'A little something for ' + C.recipientName + '.';
      $('intro-date').textContent = C.birthdayDate;
      greeting.textContent = C.greeting;

      let step = 2; // greeting = 0, rule = 1, then each line reveals in turn
      C.message.forEach((text) => {
        const p = document.createElement('p');
        p.className = 'reveal';
        p.style.setProperty('--i', step++);
        p.textContent = text;
        body.appendChild(p);
      });

      closing.textContent = C.closing;
      closing.style.setProperty('--i', step++);
      signature.textContent = 'A little thought from ' + C.senderName;
      signature.style.setProperty('--i', step);

      if (/Her First Name|Your Name/.test(C.recipientName + ' ' + C.senderName)) {
        console.warn('A Little Something: the placeholder names are still in place. Edit the CONFIG block ("EDIT HERE").');
      }

      // ----- A few champagne bubbles drifting upward, then gone -----
      function celebrate() {
        const layer = $('particles');
        const colors = ['#E3CFA0', '#F6F3EC', '#C9A96E', '#EBC6C8'];
        const spread = Math.min(window.innerWidth / 2 - 24, 190);

        for (let i = 0; i < 18; i++) {
          const p = document.createElement('span');
          p.className = 'particle';
          p.style.background = colors[i % colors.length];
          p.style.setProperty('--size', (4 + Math.random() * 4).toFixed(1) + 'px');
          p.style.setProperty('--dx', ((Math.random() * 2 - 1) * spread).toFixed(0) + 'px');
          p.style.setProperty('--dy', (-(80 + Math.random() * 200)).toFixed(0) + 'px');
          p.style.setProperty('--dur', (2.8 + Math.random() * 1.8).toFixed(2) + 's');
          p.style.setProperty('--delay', (Math.random() * 0.9).toFixed(2) + 's');
          layer.appendChild(p);
        }
        window.setTimeout(() => { layer.textContent = ''; }, 7000);
      }

      // ----- Screen change -----
      function showMessage() {
        intro.hidden = true;
        message.hidden = false;
        window.scrollTo(0, 0);
        greeting.focus({ preventScroll: true }); // keeps keyboard and screen-reader users in context
        if (!reduceMotion.matches) celebrate();
      }

      function openEnvelope() {
        if (opened) return;
        opened = true;
        openBtn.disabled = true;
        playOpeningSounds(reduceMotion.matches);
        startMusic();

        if (reduceMotion.matches) {  // skip the animation entirely
          showMessage();
          return;
        }

        intro.classList.add('is-opening');
        window.setTimeout(() => intro.classList.add('is-leaving'), FADE_OUT_AT);
        window.setTimeout(showMessage, SHOW_MESSAGE_AT);
      }

      openBtn.addEventListener('click', openEnvelope);
      envelope.addEventListener('click', openEnvelope);
    })();
  </script>
</body>
